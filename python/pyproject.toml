[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q1-sdk"
version = "0.1.0"
description = "Q1 Robot SDK — dual-wheel companion robot (Pre-SDK)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Q1 Robot SDK Authors" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
rl = ["numpy>=1.23", "torch"]

[tool.setuptools.packages.find]
where = ["."]
include = ["q1_sdk*"]
